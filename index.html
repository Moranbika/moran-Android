<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://moranenglish.cn" crossorigin />
    <link rel="dns-prefetch" href="https://moranenglish.cn" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="莫兰" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>莫兰</title>
    <script>
      (() => {
        const ua = navigator.userAgent;
        const appleTouch = /iPad|iPhone|iPod/.test(ua)
          || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const coarse = window.matchMedia('(pointer: coarse)').matches;
        const touchShell = appleTouch || (coarse && !/Windows NT/i.test(ua));
        document.documentElement.dataset.touch = touchShell ? 'true' : 'false';
      })();
    </script>
    <style>
      html {
        min-height: 100%;
        background: #000000;
      }

      body {
        min-height: 100%;
        margin: 0;
      }

      #root {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
